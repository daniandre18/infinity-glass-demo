# Publica el sitio en GitHub Pages en cada push a main.
# El sitio es estatico: no hay nada que compilar, se sube tal cual.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # para lanzarlo a mano desde la pestana Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
