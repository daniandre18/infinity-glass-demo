<style>
body{margin:0}
a{color:#0848FF}a:hover{color:#087CFF}
.ign{
  --ign-negro:#080B10;
  --ign-azul:#0848FF;
  --ign-cian:#00C8FF;
  --ign-blanco:#FFFFFF;
  --ign-gris:#F1F3F6;
  --ign-texto:#101318;
  --ign-suave:#5F6E84;
  --ign-borde:#E0E4EB;
  --ign-bordeOsc:#242C3A;

  position:sticky; top:0; z-index:900;
  font-family:inherit;
  transition:box-shadow .3s ease;
}
.ign *{ box-sizing:border-box; }
.ign__oculto{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.ign__int{
  max-width:1200px; margin:0 auto; padding:0 24px;
  display:flex; align-items:center; gap:18px;
}

/* ---------- Nivel 1: avisos ---------- */
.ign__avisos{
  background:var(--ign-azul); color:#FFFFFF;
  height:30px; overflow:hidden;
  transition:height .3s ease, opacity .3s ease;
}
.ign__avisosInt{
  height:30px; display:flex; align-items:center; justify-content:center; gap:14px;
  font-size:13px; font-weight:600;
}
.ign__punto{ width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.55); }
.ign.scrolled .ign__avisos{ height:0; opacity:0; }     /* se repliega y libera alto */

/* ---------- Nivel 2: principal ---------- */
.ign__principal{
  background:var(--ign-negro);
  transition:background .3s ease, box-shadow .3s ease;
}
.ign__principal .ign__int{ height:74px; }
.ign.scrolled .ign__principal{ background:var(--ign-blanco); }

.ign__logo{ flex:none; text-decoration:none; }
.ign__logoTexto{
  font-size:19px; font-weight:800; letter-spacing:.04em; color:#FFFFFF; white-space:nowrap;
  transition:color .3s ease;
}
.ign__logoTexto b{ color:var(--ign-cian); font-weight:800; }
.ign.scrolled .ign__logoTexto{ color:var(--ign-texto); }
.ign.scrolled .ign__logoTexto b{ color:var(--ign-azul); }

.ign__buscador{
  flex:1 1 auto; min-width:0; position:relative;
  display:flex; align-items:center; gap:10px;
  height:44px; padding:0 6px 0 16px;
  border:1px solid var(--ign-bordeOsc); border-radius:999px;
  background:#141A24;
  transition:background .3s ease, border-color .3s ease;
}
.ign__buscador:focus-within{ border-color:var(--ign-azul); }
.ign__lupa{ flex:none; color:#8795A8; transition:color .3s ease; }
.ign__input{
  flex:1 1 auto; min-width:0; border:0; outline:none; background:transparent;
  font-family:inherit; font-size:15px; color:#F5F7FA;
}
.ign__input::placeholder{ color:#7D8A9C; }
.ign__buscarBtn{
  flex:none; display:inline-flex; align-items:center; justify-content:center; line-height:1;
  height:34px; padding:0 18px; border:0; border-radius:999px;
  background:var(--ign-azul); color:#FFFFFF; font-family:inherit;
  font-size:14px; font-weight:700; cursor:pointer;
  transition:background .2s ease;
}
.ign__buscarBtn:hover{ background:#0640DB; }
.ign.scrolled .ign__buscador{ background:var(--ign-gris); border-color:var(--ign-borde); }
.ign.scrolled .ign__input{ color:var(--ign-texto); }
.ign.scrolled .ign__input::placeholder{ color:var(--ign-suave); }
.ign.scrolled .ign__lupa{ color:var(--ign-suave); }

.ign__acciones{ flex:none; display:flex; align-items:center; gap:4px; }
.ign__icono{
  position:relative; width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#F5F7FA; text-decoration:none;
  transition:color .3s ease, background .2s ease;
}
.ign__icono:hover{ background:rgba(255,255,255,.08); }
.ign.scrolled .ign__icono{ color:var(--ign-texto); }
.ign.scrolled .ign__icono:hover{ background:var(--ign-gris); }
.ign__globo{
  position:absolute; top:4px; right:3px; min-width:18px; height:18px; padding:0 5px;
  border-radius:999px; background:var(--ign-azul); color:#FFFFFF;
  font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
}

/* ---------- Nivel 3: categorias ---------- */
.ign__cats{
  background:var(--ign-negro);
  border-top:1px solid var(--ign-bordeOsc);
  transition:background .3s ease, border-color .3s ease;
}
.ign.scrolled .ign__cats{ background:var(--ign-blanco); border-top-color:var(--ign-borde); }
.ign__int--cats{ height:46px; justify-content:center; gap:40px; }
.ign__lista{ display:flex; align-items:center; gap:4px; margin:0; padding:0; list-style:none; }
.ign__lista--servicio{ gap:18px; }
.ign__item{ position:relative; }

.ign__disp, .ign__enlace{
  display:inline-flex; align-items:center; gap:7px;
  height:46px; padding:0 12px;
  border:0; background:none; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600;
  color:#E6EBF2; text-decoration:none; white-space:nowrap;
  transition:color .3s ease;
}
.ign__enlace--of{ color:var(--ign-cian); }
.ign.scrolled .ign__disp, .ign.scrolled .ign__enlace{ color:var(--ign-texto); }
.ign.scrolled .ign__enlace--of{ color:var(--ign-azul); }
.ign__disp:hover, .ign__enlace:hover{ color:var(--ign-cian); }
.ign.scrolled .ign__disp:hover, .ign.scrolled .ign__enlace:hover{ color:var(--ign-azul); }
.ign__disp:focus-visible, .ign__enlace:focus-visible, .ign__icono:focus-visible,
.ign__hamburguesa:focus-visible, .ign__acc:focus-visible{
  outline:2px solid var(--ign-cian); outline-offset:-3px; border-radius:6px;
}
.ign.scrolled .ign__disp:focus-visible, .ign.scrolled .ign__enlace:focus-visible{ outline-color:var(--ign-azul); }

.ign__flecha{
  width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px); opacity:.6;
  transition:transform .25s ease;
}
.ign__disp[aria-expanded="true"] .ign__flecha{ transform:rotate(-135deg) translate(-2px,-2px); }

/* ---------- Desplegables ---------- */
.ign__menu{
  position:absolute; top:100%; left:0; z-index:5;
  min-width:230px; padding:16px;
  background:var(--ign-blanco);
  border:1px solid var(--ign-borde); border-radius:14px;
  box-shadow:0 18px 40px rgba(10,14,20,.16);
  opacity:0; visibility:hidden; transform:translateY(-6px);
  transition:opacity .22s ease, transform .22s ease, visibility .22s;
}
.ign__menu--ancho{ min-width:660px; }
.ign__item.abierto .ign__menu{ opacity:1; visibility:visible; transform:none; }
.ign__cols{ display:flex; gap:22px; }
.ign__col{ display:flex; flex-direction:column; min-width:140px; }
.ign__colTit{
  margin:0 0 8px; font-size:11px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ign-suave);
}
.ign__menu a{
  padding:7px 8px; margin:0 -8px; border-radius:8px;
  font-size:15px; color:var(--ign-texto); text-decoration:none;
  transition:background .15s ease, color .15s ease;
}
.ign__menu a:hover{ background:var(--ign-gris); color:var(--ign-azul); }
.ign__destaque{
  display:flex !important; flex-direction:column; gap:6px; justify-content:center;
  min-width:220px; padding:16px !important; margin:0 !important;
  border-radius:12px !important;
  background:linear-gradient(150deg,#101826 0%,#070B12 100%);
  color:#F5F7FA !important;
}
.ign__destaque:hover{ background:linear-gradient(150deg,#16203200,#0A1320) !important; color:#FFFFFF !important; }
.ign__destaqueTit{ font-size:15px; font-weight:800; }
.ign__destaqueTxt{ font-size:13px; color:#94A1B3; line-height:1.4; }

/* ---------- Movil ---------- */
.ign__hamburguesa{
  display:none; flex:none; width:42px; height:42px;
  border:0; background:none; cursor:pointer;
  flex-direction:column; align-items:center; justify-content:center; gap:5px;
}
.ign__hamLinea{
  width:20px; height:2px; border-radius:2px; background:#F5F7FA;
  transition:background .3s ease, transform .25s ease, opacity .2s ease;
}
.ign.scrolled .ign__hamLinea{ background:var(--ign-texto); }
.ign__hamburguesa[aria-expanded="true"] .ign__hamLinea:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.ign__hamburguesa[aria-expanded="true"] .ign__hamLinea:nth-child(2){ opacity:0; }
.ign__hamburguesa[aria-expanded="true"] .ign__hamLinea:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

/* Cajon lateral: entra desde la izquierda por encima de la pagina.
   Nada de [hidden]: la regla display:block del media query le ganaba al atributo
   y el menu salia abierto de entrada. Cerrado = fuera de pantalla + visibility. */
.ign__panel{
  position:fixed; top:0; left:0; z-index:60;
  width:min(86vw,348px); height:100vh; height:100dvh;
  display:none; flex-direction:column;
  background:var(--ign-blanco); border-right:1px solid var(--ign-borde);
  box-shadow:18px 0 48px rgba(8,11,16,.26);
  overflow-y:auto; overscroll-behavior:contain;
  transform:translateX(-100%); visibility:hidden;
  transition:transform .34s cubic-bezier(.22,.8,.26,1), visibility .34s linear;
}
.ign__panel.abierto{ transform:translateX(0); visibility:visible; }

.ign__velo{
  position:fixed; inset:0; z-index:55;
  background:rgba(8,11,16,.5);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  opacity:0; visibility:hidden;
  transition:opacity .3s ease, visibility .3s linear;
}
.ign__velo.abierto{ opacity:1; visibility:visible; }

.ign__panelCab{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:16px 20px 10px;
}
.ign__panelTit{ font-size:13px; font-weight:800; letter-spacing:.08em; color:var(--ign-suave); }
.ign__cerrar{
  flex:none; width:40px; height:40px; margin-right:-8px; padding:0;
  border:0; border-radius:50%; background:var(--ign-gris); color:var(--ign-texto);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .2s ease;
}
.ign__cerrar:hover{ background:#E4E8EF; }

/* los renglones entran escalonados detras del cajon */
.ign__panelInt > *{ opacity:0; transform:translateX(-12px); transition:opacity .3s ease, transform .3s ease; }
.ign__panel.abierto .ign__panelInt > *{ opacity:1; transform:translateX(0); }
.ign__panel.abierto .ign__panelInt > *:nth-child(1){ transition-delay:.08s }
.ign__panel.abierto .ign__panelInt > *:nth-child(2){ transition-delay:.11s }
.ign__panel.abierto .ign__panelInt > *:nth-child(3){ transition-delay:.14s }
.ign__panel.abierto .ign__panelInt > *:nth-child(4){ transition-delay:.17s }
.ign__panel.abierto .ign__panelInt > *:nth-child(5){ transition-delay:.20s }
.ign__panel.abierto .ign__panelInt > *:nth-child(6){ transition-delay:.23s }
.ign__panel.abierto .ign__panelInt > *:nth-child(7){ transition-delay:.26s }
.ign__panel.abierto .ign__panelInt > *:nth-child(n+8){ transition-delay:.29s }
.ign__panelInt{ padding:8px 20px 20px; display:flex; flex-direction:column; }
.ign__acc, .ign__panelEnlace{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; min-height:52px; padding:0 2px;
  border:0; border-bottom:1px solid var(--ign-borde); background:none;
  font-family:inherit; font-size:16px; font-weight:600; color:var(--ign-texto);
  text-decoration:none; cursor:pointer; text-align:left;
}
.ign__accCuerpo{ display:none; padding:4px 0 10px; flex-direction:column; }
.ign__accCuerpo.abierto{ display:flex; }
.ign__accCuerpo a{
  padding:11px 12px; font-size:15px; color:var(--ign-suave); text-decoration:none;
  border-radius:8px;
}
.ign__accCuerpo a:hover{ background:var(--ign-gris); color:var(--ign-azul); }
.ign__acc[aria-expanded="true"] .ign__flecha{ transform:rotate(-135deg) translate(-2px,-2px); }

@media (max-width:980px){
  .ign__int{ padding:0 16px; gap:10px; }
  .ign__hamburguesa{ display:flex; }
  .ign__cats{ display:none; }
  .ign__principal .ign__int{ height:58px; }
  .ign__buscarBtn{ display:none; }
  .ign__buscador{ height:40px; padding:0 14px; }
  .ign__logoTexto{ font-size:16px; }
  .ign__avisosInt{ font-size:11.5px; gap:9px; }
  .ign__panel{ display:flex; }
  .ign__icono{ width:38px; height:38px; }
}
@media (max-width:560px){
  .ign__logoTexto b{ display:none; }
  .ign__avisosInt span:nth-child(n+3){ display:none; }
}

@media (prefers-reduced-motion:reduce){
  .ign, .ign *{ transition:none !important; }
}

/* Vidrio esmerilado: el contenido se ve pasar detras del menu. */
.ign.scrolled .ign__principal,
.ign.scrolled .ign__cats{
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
}
.ign.scrolled .ign__cats{ border-top-color:rgba(224,228,235,.7); }
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .ign.scrolled .ign__principal, .ign.scrolled .ign__cats{ background:#FFFFFF; }
}

.ign__logoImg{ display:block; height:48px; width:auto; }
@media (max-width:980px){ .ign__logoImg{ height:38px; } }
.ign__disp--act{ color:#0848FF !important; box-shadow:inset 0 -2px 0 #0848FF; }
/* Esta pantalla es clara: el navbar arranca directamente en su estado blanco. */
.ign .ign__buscador{ background:#F1F3F6; border-color:#E0E4EB; }
.ign .ign__input{ color:#101318; }
.ign .ign__input::placeholder{ color:#5F6E84; }
.ign .ign__lupa{ color:#5F6E84; }
.ign .ign__icono{ color:#101318; }
.ign .ign__icono:hover{ background:#F1F3F6; }
.ign .ign__disp, .ign .ign__enlace{ color:#101318; }
.ign .ign__enlace--of{ color:#0848FF; }
.ign .ign__hamLinea{ background:#101318; }
.ign .ign__cats{ border-top-color:rgba(224,228,235,.7); }

/* Pantalla clara: el vidrio aplica desde el inicio, no solo al hacer scroll. */
.ign .ign__principal, .ign .ign__cats{
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .ign .ign__principal, .ign .ign__cats{ background:#FFFFFF; }
}
.ign.scrolled{ box-shadow:0 6px 20px rgba(16,19,24,.08); }


/* Zona de compra: a la izquierda el visor 3D y, debajo, el video de la unidad;
   entre los dos llenan la altura de la columna de compra. */
@media (max-width:900px){
  .pp-fila{ grid-template-columns:1fr !important; }
  .pp-media{ flex-direction:column-reverse !important; gap:12px !important; }  /* foto arriba, miniaturas debajo */
  .pp-minis{ align-self:stretch !important; min-width:0; flex-direction:row !important;
             overflow-x:auto; padding-bottom:4px; }
  /* las pestanas no se apilan: se deslizan en horizontal */
  [role=tablist]{ flex-wrap:nowrap !important; overflow-x:auto; gap:20px !important; }
  [role=tablist] button{ white-space:nowrap; font-size:15px !important; }
}
.social{transition:border-color .15s ease}
.social:hover{border-color:#00C8FF}
.wa{transition:filter .2s ease}
.wa:hover{filter:brightness(1.12)}
.wa::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  animation:wa-halo 5s ease-out 1.5s infinite}
@keyframes wa-halo{
  0%{box-shadow:0 0 0 0 rgba(15,122,65,.45)}
  14%{box-shadow:0 0 0 13px rgba(15,122,65,0)}
  100%{box-shadow:0 0 0 0 rgba(15,122,65,0)}}
@media (prefers-reduced-motion: reduce){.wa{transition:none}.wa::after{animation:none}}
/* relacionados: 4 / 2 / 1, sin tarjetas huerfanas en la ultima fila */
@media (max-width:1180px){ .pp-rel{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }
@media (max-width:620px){ .pp-rel{ grid-template-columns:1fr !important; } }
.cta{transition:filter .15s ease}
.cta:hover{filter:brightness(1.1)}

/* ---------- Carrito previo (entra por la derecha) ---------- */
.ign__mini{
  position:fixed; top:0; right:0; z-index:60;
  width:min(92vw,404px); height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  background:var(--ign-blanco); border-left:1px solid var(--ign-borde);
  box-shadow:-18px 0 48px rgba(8,11,16,.26);
  transform:translateX(100%); visibility:hidden;
  transition:transform .32s cubic-bezier(.22,.8,.26,1), visibility .32s linear;
}
.ign__mini.abierto{ transform:translateX(0); visibility:visible; }
.ign__miniCab{
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:18px 20px 14px; border-bottom:1px solid var(--ign-borde);
}
.ign__miniTit{ font-size:18px; font-weight:800; letter-spacing:-0.01em; color:var(--ign-texto); }
.ign__miniCerrar{
  width:38px; height:38px; margin-right:-6px; padding:0; border:0; border-radius:50%;
  background:var(--ign-gris); color:var(--ign-texto);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.ign__miniCuerpo{
  flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  padding:16px 20px; display:flex; flex-direction:column; gap:16px;
}
.ign__miniEnvio{
  display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:11px;
  background:#E8F6EE; border:1px solid #BFE6D1; color:#0B5C39; font-size:13px; font-weight:700;
}
.ign__miniItem{ display:grid; grid-template-columns:64px minmax(0,1fr); gap:13px; align-items:start; }
.ign__miniFoto{
  width:64px; height:64px; border-radius:11px; background:var(--ign-gris);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ign__miniNom{ font-size:14.5px; font-weight:700; line-height:1.3; color:var(--ign-texto); }
.ign__miniSub{ font-size:12.5px; color:var(--ign-suave); padding-top:2px; }
.ign__miniLinea{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-top:6px; }
.ign__miniPrecio{ font-size:15px; font-weight:800; color:var(--ign-texto); }
.ign__miniPie{
  flex:none; border-top:1px solid var(--ign-borde); background:var(--ign-blanco);
  padding:16px 20px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:11px;
}
.ign__miniTotal{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.ign__miniBtn, .ign__miniBtn2{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:50px; border-radius:12px; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer;
}
.ign__miniBtn{ background:var(--ign-azul); color:#FFFFFF; border:0; }
.ign__miniBtn:hover{ background:#0640DB; }
.ign__miniBtn2{ background:#FFFFFF; color:var(--ign-texto); border:1px solid var(--ign-borde); }
.ign__miniBtn2:hover{ background:var(--ign-gris); }
@media (prefers-reduced-motion:reduce){ .ign__mini{ transition:none; } }

.ign__paso{ display:inline-flex; align-items:center; border:1px solid var(--ign-borde); border-radius:9px; overflow:hidden; }
.ign__pasoBtn{
  width:32px; height:32px; padding:0; border:0; background:#FFFFFF; color:var(--ign-texto);
  font-family:inherit; font-size:17px; line-height:1; cursor:pointer;
}

/* ---------- Telefono: el visor 3D y los relacionados ----------
   El escenario mide 330x645 porque asi cabe el equipo a tamano real en
   escritorio. En un telefono eso es casi una pantalla entera solo para la foto,
   asi que se reduce con un scale y se recupera el hueco que deja con un margen
   negativo (el caja sigue midiendo 645, lo que se ve mide 374).
   Los relacionados dejan la rejilla y pasan a la misma tira que los destacados
   del home: tarjetas de 269 px que enganchan al soltar el dedo. */
@media (max-width:760px){
  .pp-visor{ padding:40px 0 72px !important; }
  .pp-escena{ transform:scale(.58); transform-origin:top center; margin-bottom:-271px; }
  .pp-sombra{ width:150px !important; height:12px !important; margin-top:6px !important; }
  .pp-pista, .pp-angulo{ top:10px !important; font-size:11.5px !important; padding:5px 10px !important; }
  .pp-pista, .pp-angulo{ z-index:2; }
  .pp-pista{ left:10px !important; gap:6px !important; }
  .pp-pista svg{ width:13px !important; height:13px !important; }
  .pp-angulo{ right:10px !important; }
  .pp-mando{ bottom:14px !important; left:12px !important; right:12px !important; gap:8px !important; }
  .pp-mando > button:last-child{ padding:0 12px !important; font-size:13px !important; }

  .pp-relSec{ padding:34px 20px 44px !important; }
  .pp-relSec h2{ font-size:21px !important; }
  .pp-relSec > p{ margin-bottom:16px !important; font-size:14px !important; }
  .pp-rel{
    display:flex !important; flex-wrap:nowrap !important; gap:20px !important;
    overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-left:20px;
    -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; scrollbar-width:none;
    margin:0 -20px !important; padding:0 20px 6px !important;
  }
  .pp-rel::-webkit-scrollbar{ display:none; }
  .pp-rel > div{ flex:0 0 269px !important; min-width:0; scroll-snap-align:start; }
}

/* Los enlaces de servicio saltan a su seccion del home. El margen de anclaje
   descuenta la cabecera pegajosa (143 px en escritorio, 88 en telefono) para
   que el titular no quede escondido debajo. */
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }

/* ---------- Buscador en el telefono ----------
   Entre el logo y los iconos el campo queda espichado, asi que bajo 760 px cae
   a su propia fila, a lo ancho y con el boton Buscar al lado. Sin capas ni
   clics previos: se ve y se escribe. */
@media (max-width:760px){
  .ign__principal .ign__int{
    flex-wrap:wrap; height:auto;
    padding-top:9px; padding-bottom:10px; row-gap:9px;
  }
  .ign__buscador{ order:5; flex:1 0 100%; height:46px; padding:0 14px; }
  .ign__input{ font-size:16px; }          /* menos de 16 y iOS hace zoom al enfocar */
  .ign__buscarBtn{ display:inline-flex; height:34px; padding:0 15px; font-size:14px; }
}

/* En el telefono: hamburguesa a la izquierda, logo centrado de verdad (centrado
   absoluto, no por reparto de espacio, para que no se corra cuando los dos
   lados pesan distinto) y los iconos a la derecha. */
@media (max-width:760px){
  .ign__principal .ign__int{ position:relative; }
  .ign__logo{
    position:absolute; left:50%; top:9px; transform:translateX(-50%);
    height:44px; display:flex; align-items:center;
  }
  .ign__acciones{ margin-left:auto; gap:0; }
  .ign__icono{ width:36px; height:36px; }
  .ign__int{ padding:0 12px; }
}
/* en pantallas muy angostas el logo y los iconos se rozan: la cuenta sale de la
   barra (sigue en el cajon) antes que achicar la marca */
@media (max-width:374px){
  .ign__acciones a[aria-label="Mi cuenta"]{ display:none; }
}

/* Credito del autor: discreto, al final del pie. En el telefono se le deja
   aire por debajo para que el boton flotante de WhatsApp no lo tape. */
.ig-credito{ margin-top:24px; padding-top:18px; border-top:1px solid #1B2230;
  font-size:12px; line-height:1.5; color:#7E8CA0; }
.ig-credito a{ color:#A3B2C6; text-decoration:none; border-bottom:1px solid #3B4A5E; }

<script src="motor.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { angle: 0, thumb: 0, spinning: false, tab: 1, favs: {} };
    this._timer = null;
    this.girarConElDedo();
      this.navbar();
    this.volarAlCarrito();
  }

  navbar() {
    if (typeof window === 'undefined' || window.igNav) return;
    var listo = function () {
      if (!document.getElementById('ignHeader')) return setTimeout(listo, 120);
      var header = document.getElementById('ignHeader');
        if (!header || header.dataset.ignListo) return;
        header.dataset.ignListo = '1';

        var ham    = document.getElementById('ignHam');
        var panel  = document.getElementById('ignPanel');
        var items  = Array.prototype.slice.call(header.querySelectorAll('.ign__item'));
        var finoPuntero = window.matchMedia && window.matchMedia('(hover: hover)').matches;
        var limpieza = [];                        // para poder soltar todo despues

        function escuchar(obj, evt, fn, op) {
          obj.addEventListener(evt, fn, op);
          limpieza.push(function () { obj.removeEventListener(evt, fn, op); });
        }

        /* ---------- Sticky: clase 'scrolled' pasados los 50 px ---------- */
        var pendiente = false, puesta = false;
        function revisar() {
          pendiente = false;
          /* Banda muerta de 24 a 64 px. Tiene que ser mas ancha que la barra de
             avisos (30 px): al replegarse mueve el contenido y el navegador
             corrige el scroll, y con un umbral unico eso reabria la barra. */
          var y = window.scrollY;
          var debe = puesta ? (y > 24) : (y > 64);
          if (debe !== puesta) { puesta = debe; header.classList.toggle('scrolled', debe); }
        }
        function alScroll() { if (!pendiente) { pendiente = true; requestAnimationFrame(revisar); } }
        escuchar(window, 'scroll', alScroll, { passive: true });
        revisar();

        /* ---------- Desplegables de escritorio ---------- */
        function abrir(li, si) {
          li.classList.toggle('abierto', si);
          var b = li.querySelector('.ign__disp');
          if (b) b.setAttribute('aria-expanded', si ? 'true' : 'false');
        }
        function cerrarTodos(menos) {
          items.forEach(function (li) { if (li !== menos) abrir(li, false); });
        }

        items.forEach(function (li) {
          var btn = li.querySelector('.ign__disp');
          if (!btn) return;

          escuchar(btn, 'click', function (e) {
            e.preventDefault();
            /* Con mouse el menu ya lo abrio el hover: si el clic tambien alternara,
               lo cerraria de inmediato. e.detail === 0 distingue Enter/Espacio. */
            var teclado = e.detail === 0;
            if (finoPuntero && !teclado) return;
            var ya = li.classList.contains('abierto');
            cerrarTodos(li);
            abrir(li, !ya);
          });

          if (finoPuntero) {
            var cerrar;
            escuchar(li, 'mouseenter', function () { clearTimeout(cerrar); cerrarTodos(li); abrir(li, true); });
            escuchar(li, 'mouseleave', function () { cerrar = setTimeout(function () { abrir(li, false); }, 140); });
            limpieza.push(function () { clearTimeout(cerrar); });
          }

          /* Al salir del ultimo enlace con Tab, se cierra. */
          escuchar(li, 'focusout', function (e) {
            if (!li.contains(e.relatedTarget)) abrir(li, false);
          });
        });

        escuchar(document, 'keydown', function (e) {
          if (e.key !== 'Escape') return;
          var abierto = header.querySelector('.ign__item.abierto');
          if (abierto) { abrir(abierto, false); var b = abierto.querySelector('.ign__disp'); if (b) b.focus(); }
          if (panelAbierto()) cerrarPanel();
          if (miniAbierto()) cerrarMini();
        });

        escuchar(document, 'click', function (e) {
          if (!header.contains(e.target)) { cerrarTodos(null); cerrarPanel(); }
        });

        /* ---------- Cajon movil ---------- */
        var velo = document.getElementById('ignVelo');
        var cerrarBtn = document.getElementById('ignCerrar');
        function panelAbierto() { return !!panel && panel.classList.contains('abierto'); }
        function moverPanel(si) {
          if (!panel) return;
          panel.classList.toggle('abierto', si);
          if (velo) velo.classList.toggle('abierto', si);
          if (ham) {
            ham.setAttribute('aria-expanded', si ? 'true' : 'false');
            ham.setAttribute('aria-label', si ? 'Cerrar menú' : 'Abrir menú');
          }
          /* el fondo no se mueve mientras el cajon esta abierto */
          document.body.style.overflow = si ? 'hidden' : '';
          if (si && cerrarBtn) cerrarBtn.focus();
          else if (!si && ham) ham.focus();
        }
        function cerrarPanel() { if (panelAbierto()) moverPanel(false); }
        if (ham && panel) {
          escuchar(ham, 'click', function () { moverPanel(!panelAbierto()); });
          if (velo) escuchar(velo, 'click', cerrarPanel);
          if (cerrarBtn) escuchar(cerrarBtn, 'click', cerrarPanel);
          /* al elegir una categoria el cajon se cierra solo */
          Array.prototype.forEach.call(panel.querySelectorAll('a'), function (a) {
            escuchar(a, 'click', cerrarPanel);
          });
          Array.prototype.forEach.call(panel.querySelectorAll('.ign__acc'), function (b) {
            escuchar(b, 'click', function () {
              var cuerpo = b.nextElementSibling;
              var abre = !cuerpo.classList.contains('abierto');
              cuerpo.classList.toggle('abierto', abre);
              b.setAttribute('aria-expanded', abre ? 'true' : 'false');
            });
          });
        }

                /* ---------- Carrito previo ---------- */
        var mini = document.getElementById('ignMini');
        var miniCerrar = document.getElementById('ignMiniCerrar');
        var iconoCarrito = header.querySelector('.ign__carrito');
        function miniAbierto() { return !!mini && mini.classList.contains('abierto'); }
        function verMini(si) {
          if (!mini) return;
          if (si && panelAbierto()) moverPanel(false);   /* uno u otro, nunca los dos */
          mini.classList.toggle('abierto', si);
          if (velo) velo.classList.toggle('abierto', si);
          document.body.style.overflow = si ? 'hidden' : '';
          if (si && miniCerrar) miniCerrar.focus();
          else if (!si && iconoCarrito) iconoCarrito.focus();
        }
        function cerrarMini() { if (miniAbierto()) verMini(false); }
        if (mini && iconoCarrito) {
          escuchar(iconoCarrito, 'click', function (e) {
            e.preventDefault();          /* el href queda como respaldo si no hay JS */
            verMini(!miniAbierto());
          });
          if (miniCerrar) escuchar(miniCerrar, 'click', cerrarMini);
          if (velo) escuchar(velo, 'click', cerrarMini);
        }
        /* cantidades del carrito previo: el equipo es unidad unica, el accesorio no */
        (function () {
          if (!mini) return;
          var EQ = 2899000, EQT = 2799000, CA = 149000, CAT = 144000, n = 1;
          var cop = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
          function money(v) { return cop.format(v).replace(/\u00a0/g, ' '); }
          var cant   = mini.querySelector('[data-mini-cant]');
          var linea  = mini.querySelector('[data-mini-linea]');
          var sub    = mini.querySelector('[data-mini-subtotal]');
          var transf = mini.querySelector('[data-mini-transf]');
          var cuenta = mini.querySelector('[data-mini-conteo]');
          var menos  = mini.querySelector('[data-mini="-"]');
          if (!cant) return;
          function pintar() {
            cant.textContent = n;
            if (linea)  linea.textContent  = money(CA * n);
            if (sub)    sub.textContent    = money(EQ + CA * n);
            if (transf) transf.textContent = money(EQT + CAT * n) + ' pagando con transferencia';
            if (cuenta) cuenta.textContent = 'Tu carrito (' + (1 + n) + ')';
            if (menos)  menos.disabled = n <= 1;
          }
          Array.prototype.forEach.call(mini.querySelectorAll('[data-mini]'), function (b) {
            escuchar(b, 'click', function () {
              n = Math.max(1, Math.min(5, n + (b.getAttribute('data-mini') === '+' ? 1 : -1)));
              pintar();
            });
          });
          pintar();
        })();

        /* El tema puede re-renderizar: asi se sueltan todos los listeners. */
        window.igNav = {
          /* Lo usa la animacion de agregar al carrito: cuando el producto
             aterriza en el icono, el panel se abre con el resumen. */
          verCarrito: function (si) { verMini(si !== false); },
          destruir: function () {
            limpieza.forEach(function (f) { f(); });
            limpieza = [];
            document.body.style.overflow = '';
            delete header.dataset.ignListo;
          }
        };
    };
    listo();
  }
  // El producto "vuela" al carrito al agregarlo. Solo se animan transform y
  // opacity (las dos propiedades que no obligan a recalcular diseno), el nodo
  // vive fuera del flujo y se borra al aterrizar. Quien pidio menos animacion
  // ve unicamente el latido del globo.
  volarAlCarrito() {
    if (typeof window === 'undefined' || window.__igVuelo) return;
    window.__igVuelo = true;
    var listo = function () {
      if (!document || !document.body) { setTimeout(listo, 30); return; }

      var latir = function (destino) {
        var globo = destino.querySelector('.ign__globo');
        if (!globo || !globo.animate) return;
        globo.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }],
          { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' }
        );
      };

      var volar = function (destino) {
        // la foto grande, no la miniatura: el vuelo sale de lo que el cliente esta mirando
        // querySelector con lista devuelve el primero del DOM, que seria la miniatura:
        // por eso se pregunta en orden, de la foto grande hacia abajo
        var foto = document.querySelector('.pn-foto') || document.querySelector('.pn-gal img') || document.querySelector('.pp-gal img');
        var origen = foto || document.querySelector('.pp-visor') || document.querySelector('.pp-gal');
        if (!origen) return;
        var a = origen.getBoundingClientRect();
        var b = destino.getBoundingClientRect();
        // si la cabecera ya se fue hacia arriba, el paquete va a la esquina
        if (b.bottom < 8) b = { left: window.innerWidth - 64, top: 12, width: 40, height: 40 };

        var nodo, ancho, alto;
        if (foto) {
          nodo = foto.cloneNode(true);
          var escala = Math.min(1, 190 / Math.max(a.width, a.height));
          ancho = a.width * escala; alto = a.height * escala;
          nodo.style.objectFit = 'contain';
        } else {
          nodo = document.createElement('div');
          ancho = 92; alto = 172;
          nodo.style.background = 'linear-gradient(160deg,#1B2430,#0A0E14)';
          nodo.style.border = '2px solid #3B4A5F';
          nodo.style.borderRadius = '16px';
        }
        nodo.setAttribute('aria-hidden', 'true');
        nodo.style.position = 'fixed';
        nodo.style.left = (a.left + a.width / 2 - ancho / 2) + 'px';
        nodo.style.top = (a.top + a.height / 2 - alto / 2) + 'px';
        nodo.style.width = ancho + 'px';
        nodo.style.height = alto + 'px';
        nodo.style.margin = '0';
        nodo.style.padding = '0';
        nodo.style.zIndex = '2000';
        nodo.style.pointerEvents = 'none';
        nodo.style.willChange = 'transform, opacity';
        document.body.appendChild(nodo);

        if (!nodo.animate) { nodo.parentNode.removeChild(nodo); return; }
        var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
        var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
        var anim = nodo.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
          { transform: 'translate(' + (dx * 0.55) + 'px,' + (dy * 0.45 - 90) + 'px) scale(.55)', opacity: .95, offset: .55 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.08)', opacity: .15, offset: 1 }
        ], { duration: 760, easing: 'cubic-bezier(.45,.05,.25,1)' });
        var limpiar = function () { if (nodo.parentNode) nodo.parentNode.removeChild(nodo); };
        anim.onfinish = limpiar;
        anim.oncancel = limpiar;
        setTimeout(limpiar, 1600);   // por si la pestana se va a segundo plano
      };

      document.addEventListener('click', function (ev) {
        var boton = ev.target && ev.target.closest ? ev.target.closest('[data-agregar]') : null;
        if (!boton) return;
        var destino = document.querySelector('.ign__carrito');
        if (!destino) return;
        var quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!quieto) volar(destino);
        latir(destino);
        /* El panel se abre cuando el producto aterriza, no antes: si se abre
           de una, tapa la animacion y el cliente no ve a donde fue el equipo. */
        setTimeout(function () {
          if (window.igNav && window.igNav.verCarrito) window.igNav.verCarrito(true);
        }, quieto ? 120 : 720);
      }, true);
    };
    listo();
  }

  // Girar el equipo arrastrando. Durante el gesto se mueve el DOM directo: pasar por
  // el estado en cada pointermove re-renderiza la pantalla entera y se siente pesado.
  // Al soltar se hace un solo setState y todo queda sincronizado (angulo, slider y rotulo).
  girarConElDedo() {
    if (typeof window === 'undefined' || window.__igGiro360) return;
    window.__igGiro360 = true;
    const self = this;
    function listo() {
      var caja = document.querySelector('.pp-visor');
      var fono = document.getElementById('ppFono');
      if (!caja || !fono) return setTimeout(listo, 120);

      caja.style.touchAction = 'pan-y';   // el scroll vertical sigue siendo del dedo
      caja.style.cursor = 'grab';
      var x0 = null, a0 = 0, ang = 0;

      caja.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button, input, a')) return;   // no le robamos el control al slider
        x0 = e.clientX;
        a0 = self.state.angle || 0;
        ang = a0;
        caja.style.cursor = 'grabbing';
        if (caja.setPointerCapture) caja.setPointerCapture(e.pointerId);
      });

      caja.addEventListener('pointermove', function (e) {
        if (x0 === null) return;
        ang = Math.round(a0 + (e.clientX - x0) * 0.75) % 360;
        if (ang < 0) ang += 360;
        fono.style.transform = 'rotateY(' + ang + 'deg)';
      }, { passive: true });

      function soltar() {
        if (x0 === null) return;
        x0 = null;
        caja.style.cursor = 'grab';
        self.setState({ angle: ang, spinning: false });
      }
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
        caja.addEventListener(ev, soltar);
      });
    }

  }

  componentWillUnmount() {
    if (this._timer) clearInterval(this._timer);

  renderVals() {
    // Tema: el atributo viaja en el contenedor raiz y la hoja de estilos hace el resto.
    // claro por defecto; el boton de la cabecera enciende el modo oscuro
    const oscuro = !!this.state.oscuro;
    // Pestanas del bloque de detalles: la primera activa por defecto.
    const tab = this.state.tab || 1;
    const pestana = (n) => ({

      color: tab === n ? '#0848FF' : '#5F6E84',
      borde: tab === n ? '3px solid #0848FF' : '3px solid transparent',
      ir: () => this.setState({ tab: n })

    const a = ((angle % 360) + 360) % 360;
    let face = 'Frente';
    if (a >= 45 && a < 135) face = 'Lateral';
    else if (a >= 135 && a < 225) face = 'Trasera';
    else if (a >= 225 && a < 315) face = 'Lateral';
    const thumbSrc = [
      { label: '360°', alt: 'Vista 360 grados' },
      { label: 'Frente', alt: 'Foto de frente' },
      { label: 'Trasera', alt: 'Foto trasera' },
      { label: 'Bordes', alt: 'Foto de los bordes' },
      { label: 'Batería', alt: 'Captura de salud de batería' },

    const thumbs = thumbSrc.map((t, i) => {

        label: t.label,
        alt: t.alt,
        color: sel ? '#101318' : '#5F6E84',
        border: sel ? '2px solid #0848FF' : '1px solid #E0E4EB',
        pick: () => this.setState({ thumb: i })

    const report = [
      { k: 'Pantalla', v: 'Sin uso, con película original de fábrica', bg: '#FFFFFF' },
      { k: 'Salud de batería', v: '100% · 2 ciclos de carga', bg: '#F1F5F9' },
      { k: 'Carcasa y bordes', v: 'Titanio azul, sin marcas ni microrayas', bg: '#FFFFFF' },
      { k: 'Cámaras y Face ID', v: 'Las tres cámaras y Face ID probados y funcionando', bg: '#F1F5F9' },
      { k: 'Botones y puertos', v: 'Volumen, botón de acción y puerto USB-C probados', bg: '#FFFFFF' },
      { k: 'iCloud y operador', v: 'Libre de iCloud y desbloqueado de fábrica', bg: '#F1F5F9' },
      { k: 'Reparaciones previas', v: 'Ninguna · todas las piezas son originales', bg: '#FFFFFF' }
    ];
    const pays = [
      { label: 'Addi' }, { label: 'PSE' }, { label: 'Nequi' },
      { label: 'Visa' }, { label: 'Mastercard' }, { label: 'Transferencia' }
    ];
    // Mismos equipos y precios que el catalogo del home: si un modelo aparece en
    // las dos pantallas tiene que valer lo mismo.
    const cop = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
    const money = (v, ph) => (typeof v === 'number' ? cop.format(v).replace(/\u00a0/g, ' ') : ph);
    const tonos = {
      sellado: { bg: '#E3F4EC', color: '#0B5C39' },
      open:    { bg: '#E6EDFF', color: '#0848FF' },
      usado:   { bg: '#FDF0DC', color: '#8A4B08' }
    };
    const favs = this.state.favs || {};
    const vecinos = [
      { name: 'iPhone 14 128 GB', cond: 'Usado grado A · Batería 92%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/0ce668a7bd218dea2e05be77b4dd89d6.webp',
        valor: 1699000, antes: null, transferencia: 1639000 },
      { name: 'iPhone 13 128 GB', cond: 'Usado grado A · Batería 89%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        valor: 1349000, antes: 1499000, transferencia: 1299000 },
      { name: 'iPhone 13 256 GB', cond: 'Usado grado A · Batería 94%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        valor: 1749000, antes: null, transferencia: 1689000 },
      { name: 'Cargador 20W original', cond: 'Nuevo sellado · USB-C',
        estado: 'sellado', etiqueta: 'Nuevo sellado',
        img: null,
        valor: 149000, antes: null, transferencia: 144000 }
    ];
    const related = vecinos.map((p, i) => {
      const off = (typeof p.valor === 'number' && typeof p.antes === 'number' && p.antes > p.valor);
      const tono = tonos[p.estado];
      const fav = !!favs[i];
      return {
        name: p.name, cond: p.cond, off: off,
        // sellado -> ficha de equipo nuevo; usado y open box -> ficha de unidad unica
        enlace: p.estado === 'sellado' ? 'ProductoNuevo.dc.html' : 'Producto.dc.html',
        tieneFoto: !!p.img, sinFoto: !p.img, img: p.img,
        alt: p.name + ', foto real de la unidad',
        badge: off ? Math.round((1 - p.valor / p.antes) * 100) + '% OFF' : p.etiqueta,
        badgeBg: off ? '#0848FF' : tono.bg,
        badgeColor: off ? '#FFFFFF' : tono.color,
        icoSellado: !off && p.estado === 'sellado',
        icoOpen: !off && p.estado === 'open',
        icoUsado: !off && p.estado === 'usado',
        price: money(p.valor, '$ [PRECIO]'),
        was: money(p.antes, '$ [ANTES]'),
        transfer: money(p.transferencia, '$ [CON TRANSFERENCIA]'),
        fav: fav,
        favFill: fav ? '#0848FF' : 'none',
        favColor: fav ? '#0848FF' : '#94A1B3',
        favLabel: (fav ? 'Quitar de favoritos: ' : 'Guardar en favoritos: ') + p.name,
        toggleFav: () => {
          const next = Object.assign({}, this.state.favs);
          next[i] = !next[i];
          this.setState({ favs: next });
        }
      };
    });
    return {
      tema: oscuro ? 'oscuro' : 'claro',
      temaOscuro: oscuro,
      temaClaro: !oscuro,
      temaLabel: oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro',
      cambiarTema: () => this.setState({ oscuro: !oscuro }),
      t1: pestana(1), t2: pestana(2), t3: pestana(3),
      esTab1: tab === 1, esTab2: tab === 2, esTab3: tab === 3,
      angle,
      rot: angle,
      is360: this.state.thumb === 0,
      angleLabel: face + ' · ' + a + '°',
      thumbs,
      report,
      pays,
      related,
      spinLabel: this.state.spinning ? 'Detener' : 'Girar solo',
      onAngle: (e) => this.setState({ angle: Number(e.target.value) }),
      prev: () => this.setState({ angle: (this.state.angle + 345) % 360 }),
      next: () => this.setState({ angle: (this.state.angle + 15) % 360 }),
      toggleSpin: () => {
        if (this._timer) {
          clearInterval(this._timer);
          this._timer = null;
          this.setState({ spinning: false });
        } else {
          this._timer = setInterval(() => this.setState({ angle: (this.state.angle + 2) % 360 }), 40);
          this.setState({ spinning: true });
        }
      }
    };
  }
}
