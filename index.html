/* Cajon lateral: entra desde la izquierda por encima de la pagina.
   Nada de [hidden]: la regla display:block del media query le ganaba al atributo

.ign__panel{
  position:fixed; top:0; left:0; z-index:60;
  width:min(86vw,348px); height:100vh; height:100dvh;
  display:none; flex-direction:column;

  box-shadow:18px 0 48px rgba(8,11,16,.26);
  overflow-y:auto; overscroll-behavior:contain;
  transform:translateX(-100%); visibility:hidden;
  transition:transform .34s cubic-bezier(.22,.8,.26,1), visibility .34s linear;
}
.ign__panel.abierto{ transform:translateX(0); visibility:visible; }

.ign__velo{
  position:fixed; inset:0; z-index:55;
  background:rgba(8,11,16,.5);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  opacity:0; visibility:hidden;
  transition:opacity .3s ease, visibility .3s linear;
}
.ign__velo.abierto{ opacity:1; visibility:visible; }

/* El estado inicial lo pone la clase que agrega el script. */
/* Duracion del revelado. Subila o bajala aca y cambia en toda la pagina. */
:root{ --ig-dur:1.1s; }

.ig-rev{
  opacity:0;
  will-change:opacity, transform;
  transition:
    opacity   var(--ig-dur, 1.1s) cubic-bezier(.22,.61,.26,1),
    transform var(--ig-dur, 1.1s) cubic-bezier(.22,.61,.26,1);
  transition-delay:var(--ig-d, 0ms);
}
.ig-rev--subir  { transform:translate3d(0, 34px, 0); }
.ig-rev--escala { transform:translate3d(0, 22px, 0) scale(.965); }
.ig-rev--fundido{ transform:none; }
.ig-rev--suave  { transform:translate3d(0, 18px, 0); }   /* entrada discreta */

.ig-rev.ig-visible{
  opacity:1;
  transform:none;
  will-change:auto;            /* se libera al terminar */
}

/* El equipo del banner gira con el scroll: el giro lo escribe el script. */
.ig-hero--scroll .ig-fono{ animation:none; }

@media (prefers-reduced-motion:reduce){
  .ig-rev, .ig-rev--subir, .ig-rev--escala, .ig-rev--fundido{
    opacity:1 !important; transform:none !important; transition:none !important;
  }
}
/* ---------- Paleta ---------- */
.ig-hero{
  --ig-negro:#080B10;
  --ig-negro2:#111827;
  --ig-azul:#0848FF;
  --ig-azul2:#087CFF;

  position:relative;

  isolation:isolate;
  background:linear-gradient(180deg, var(--ig-negro) 0%, var(--ig-negro2) 100%);
  font-family:inherit;
}

/* ---------- Fondo dinamico ---------- */

/* ---------- Pulso electrico (SVG + CSS, sin librerias) ----------
   El resplandor son trazos apilados, no drop-shadow: medido, un filtro sobre el
   trazo animado costaba 50 cuadros perdidos por pasada de scroll; asi cuesta 4. */
.ig-pulso{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.ig-pulso svg{ width:100%; height:100%; display:block; }
/* apaga el pulso detras del texto sin mask-image, que tambien cuesta cuadros */
.ig-pulso__velo{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, #080B10 0%, rgba(8,11,16,.94) 26%, rgba(8,11,16,.45) 50%, rgba(8,11,16,0) 72%);
}
.ig-pulso svg path{ fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* la via apagada: siempre visible, sin animacion */
.ig-pulso__via{ stroke:#0848FF; stroke-width:1.2; opacity:.13; }

/* la corriente: halo ancho + halo medio + nucleo, los tres con el mismo recorrido */
.ig-pulso__halo,
.ig-pulso__halo2,
.ig-pulso__nucleo,
.ig-pulso__chispa{
  stroke-dasharray:12 88; stroke-dashoffset:100;
  animation:ig-corriente 7.6s linear infinite;
}
.ig-pulso__halo  { stroke:#0848FF; stroke-width:12; opacity:.08; }
.ig-pulso__halo2 { stroke:#087CFF; stroke-width:5;  opacity:.17; }
.ig-pulso__nucleo{ stroke:url(#igPulsoDegradado); stroke-width:2; opacity:.72; }
/* la cabeza: punto blanco al frente de la corriente */
.ig-pulso__chispa{ stroke:#CFE9FF; stroke-width:2.2; opacity:.8; stroke-dasharray:1 99; }

/* segunda linea, mas tenue y mas lenta */
.ig-pulso__via.ig-pulso__b   { opacity:.09; }
.ig-pulso__halo.ig-pulso__b  { stroke-width:8; opacity:.045; animation-duration:11.5s; }
.ig-pulso__nucleo.ig-pulso__b{ stroke-width:1.5; opacity:.4; animation-duration:11.5s; }

@keyframes ig-corriente{ from{ stroke-dashoffset:100; } to{ stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce){
  .ig-pulso__halo, .ig-pulso__halo2, .ig-pulso__chispa{ display:none; }
  .ig-pulso__nucleo{ animation:none; stroke-dasharray:none; stroke-dashoffset:0; opacity:.4; }
}
/* Mientras se hace scroll el trazo se congela: repintarlo compite con el
   menu pegajoso y su vidrio esmerilado. Vuelve solo al soltar. */
.ig-pulso.quieto path{ animation-play-state:paused; }
@media (max-width:640px){
  /* sin esto el dibujo se aplasta 3,3 veces y los picos quedan como barras verticales:
     el lienzo mantiene 820px de ancho y se recorta centrado */
  .ig-pulso svg{ position:absolute; top:0; left:50%; width:820px; margin-left:-410px; }
  /* como solo se ve la mitad del dibujo, van dos corrientes por vuelta para que
     siempre haya uno a la vista */
  .ig-pulso__halo, .ig-pulso__halo2, .ig-pulso__nucleo{ stroke-dasharray:11 39; }
  .ig-pulso__chispa{ stroke-dasharray:1 49; }
  .ig-pulso__nucleo{ stroke-width:1.8; }
  .ig-pulso__halo{ stroke-width:9; }
  .ig-pulso__velo{ background:linear-gradient(180deg, rgba(8,11,16,.85) 0%, rgba(8,11,16,.45) 42%, rgba(8,11,16,0) 100%); }
}

.ig-hero__cuerpo{
  position:relative; z-index:1;
  max-width:1200px; margin:0 auto;
  padding:72px 32px 80px;
  box-sizing:border-box;
  display:flex; flex-wrap:wrap; align-items:center; gap:40px;
}

/* ---------- Columna de texto ---------- */
.ig-hero__texto{ flex:1 1 440px; min-width:0; display:flex; flex-direction:column; gap:20px; }

.ig-hero__filete{
  width:72px; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--ig-cian), var(--ig-azul));
  animation:ig-entra .7s cubic-bezier(.2,.7,.2,1) both;
}

.ig-hero__titulo{
  margin:0;
  /* El degradado se recorta contra la caja del titulo, no contra las letras:
     con un interlineado de 1,05 la panza de la "g" de "pagues" cae fuera y se
     ve cortada. Se agranda la caja por abajo y se descuenta el mismo alto en
     el margen, para que el degradado alcance la cola de las letras sin mover
     ni un pixel el resto del banner. */
  padding-bottom:.13em;
  margin-bottom:-.13em;
  font-size:clamp(34px, 5vw, 56px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.025em;
  color:var(--ig-texto);                 /* respaldo si no hay background-clip */
  background:linear-gradient(104deg,
    #FFFFFF 0%, #C8D6EA 24%, #FFFFFF 42%, #9FC6F2 62%, #FFFFFF 80%, #D8E4F4 100%);
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text;
  animation:ig-entra .8s cubic-bezier(.2,.7,.2,1) .06s both, ig-cromo 9s ease-in-out 1s infinite;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .ig-hero__titulo{ color:transparent; }
}

.ig-hero__bajada{
  margin:0; font-size:19px; line-height:1.5; color:var(--ig-gris); max-width:500px;
  animation:ig-entra .8s cubic-bezier(.2,.7,.2,1) .14s both;
}

/* ---------- Boton ---------- */
.ig-hero__cta{
  align-self:flex-start;
  display:inline-flex; align-items:center; justify-content:center;
  min-height:54px; padding:0 32px;
  border-radius:999px;
  background:var(--ig-azul);
  color:#FFFFFF; font-size:16px; font-weight:700; text-decoration:none;
  transition:background .2s ease, box-shadow .2s ease, transform .2s ease;
  animation:ig-entra .8s cubic-bezier(.2,.7,.2,1) .22s both;
  will-change:transform;
}
.ig-hero__cta:hover,
.ig-hero__cta:focus-visible{
  background:#0640DB;                       /* 7,60:1 con el texto blanco */
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(8,72,255,.32);
}
.ig-hero__cta:active{ transform:none; }

.ig-hero__pista{
  margin:0; display:flex; align-items:center; gap:9px;
  font-size:13px; color:#7E8CA0;
  animation:ig-entra .8s cubic-bezier(.2,.7,.2,1) .3s both;
}
.ig-hero__pistaIcono{
  width:8px; height:8px; border-radius:50%; background:var(--ig-cian);
  box-shadow:0 0 0 0 rgba(0,200,255,.55);
  animation:ig-latido 2.4s ease-out infinite;
}

/* ---------- Escena 3D ---------- */
.ig-hero__escena{
  flex:1 1 380px; min-width:0;
  display:flex; align-items:center; justify-content:center;
  perspective:1400px;
  position:relative;
  padding:18px 0 34px;
  animation:ig-entra .9s cubic-bezier(.2,.7,.2,1) .18s both;
}
.ig-fono{
  position:relative;
  width:250px; height:510px;
  transform-style:preserve-3d;
  transform:rotateY(-18deg);
  animation:ig-flota 6s ease-in-out infinite;
}
.ig-fono__cara{
  position:absolute; left:50%; top:50%;
  width:250px; height:510px; margin:-255px 0 0 -125px;
  border-radius:40px;
  backface-visibility:hidden;
  box-sizing:border-box;
}
.ig-fono__frente{
  transform:translateZ(7px);
  background:linear-gradient(145deg,#4A5568 0%,#262E3C 32%,#59667A 52%,#1C2430 76%,#49566A 100%);
  padding:6px;
  box-shadow:0 0 60px rgba(0,200,255,.22);
}
.ig-fono__pantalla{
  position:relative; width:100%; height:100%;
  border-radius:34px; overflow:hidden; background:#05070B;
}
.ig-fono__fondo{
  position:absolute; inset:0;
  background:
    radial-gradient(120% 70% at 22% 14%, rgba(0,200,255,.50) 0%, rgba(0,200,255,0) 52%),
    radial-gradient(110% 80% at 82% 82%, rgba(8,72,255,.60) 0%, rgba(8,72,255,0) 56%),
    linear-gradient(170deg,#0B1222 0%,#070B14 100%);
}
.ig-fono__isla{
  position:absolute; top:14px; left:50%; margin-left:-31px;
  width:62px; height:18px; border-radius:11px; background:#05070B;
}
.ig-fono__atras{
  transform:rotateY(180deg) translateZ(7px);
  background:linear-gradient(145deg,#4C596D 0%,#28303E 34%,#5C6A80 54%,#1E2634 78%,#4A5768 100%);
}
.ig-fono__camaras{
  position:absolute; top:18px; left:18px;
  width:104px; height:104px; border-radius:30px;
  background:linear-gradient(140deg,#515F74 0%,#2A3340 58%,#48566B 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
  display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:11px; box-sizing:border-box;
}
.ig-fono__lente{
  width:34px; height:34px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #2A3A52 0%, #080C14 58%, #04060A 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.10);
}
.ig-fono__flash{
  width:16px; height:16px; border-radius:50%; align-self:center; justify-self:center;
  background:radial-gradient(circle at 36% 32%, #FFF8E6 0%, #D9C9A4 55%, #8E8468 100%);
}
.ig-fono__canto{
  position:absolute; left:50%; top:50%;
  background:linear-gradient(180deg,#5C6A80 0%,#2A3340 46%,#59667A 100%);
}
.ig-fono__canto--izq{ width:14px; height:446px; margin:-223px 0 0 -7px; transform:rotateY(-90deg) translateZ(125px); border-radius:7px; }
.ig-fono__canto--der{ width:14px; height:446px; margin:-223px 0 0 -7px; transform:rotateY(90deg)  translateZ(125px); border-radius:7px; }
.ig-fono__canto--arriba{ width:186px; height:14px; margin:-7px 0 0 -93px; transform:rotateX(90deg)  translateZ(255px); border-radius:7px;
  background:linear-gradient(90deg,#5C6A80 0%,#2A3340 50%,#59667A 100%); }
.ig-fono__canto--abajo{ width:186px; height:14px; margin:-7px 0 0 -93px; transform:rotateX(-90deg) translateZ(255px); border-radius:7px;
  background:linear-gradient(90deg,#5C6A80 0%,#2A3340 50%,#59667A 100%); }
.ig-fono__boton{ position:absolute; left:2px; width:10px; border-radius:4px; background:#6A7A90; }
.ig-fono__boton--silencio{ top:96px; height:26px; }
.ig-fono__boton--vol1{ top:142px; height:48px; }
.ig-fono__boton--vol2{ top:202px; height:48px; }
.ig-fono__boton--encendido{ top:168px; height:72px; }
.ig-fono__sombra{
  position:absolute; bottom:6px; left:50%; margin-left:-110px;
  width:220px; height:26px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,200,255,.26) 0%, rgba(0,0,0,0) 70%);
  filter:blur(6px);
}

/* ---------- Animaciones ---------- */
@keyframes ig-entra{ from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none} }
@keyframes ig-cromo{ 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
@keyframes ig-flota{ 0%,100%{translate:0 0} 50%{translate:0 -12px} }
@keyframes ig-latido{
  0%{box-shadow:0 0 0 0 rgba(0,200,255,.55)}
  70%{box-shadow:0 0 0 9px rgba(0,200,255,0)}
  100%{box-shadow:0 0 0 0 rgba(0,200,255,0)}
}

/* ---------- Responsivo ---------- */
@media (max-width:880px){
  .ig-hero__cuerpo{ padding:52px 20px 60px; gap:30px; }
  .ig-hero__texto{ flex:1 1 100%; align-items:center; text-align:center; }
  .ig-hero__bajada{ max-width:none; }
  .ig-hero__cta{ align-self:center; }
  .ig-hero__escena{ flex:1 1 100%; padding:4px 0 24px; }
  .ig-fono{ width:200px; height:408px; }
  .ig-fono__cara{ width:200px; height:408px; margin:-204px 0 0 -100px; border-radius:33px; }
  .ig-fono__pantalla{ border-radius:28px; }
  .ig-fono__camaras{ width:84px; height:84px; border-radius:24px; padding:9px; }
  .ig-fono__lente{ width:27px; height:27px; }
  .ig-fono__canto--izq,.ig-fono__canto--der{ height:356px; margin:-178px 0 0 -7px; }
  .ig-fono__canto--izq{ transform:rotateY(-90deg) translateZ(100px); }
  .ig-fono__canto--der{ transform:rotateY(90deg)  translateZ(100px); }
  .ig-fono__canto--arriba,.ig-fono__canto--abajo{ width:148px; margin:-7px 0 0 -74px; }
  .ig-fono__canto--arriba{ transform:rotateX(90deg)  translateZ(204px); }
  .ig-fono__canto--abajo{ transform:rotateX(-90deg) translateZ(204px); }
  .ig-hero__pista{ display:none; }
}

/* En telefono el banner ocupaba 1,13 pantallas: nadie veia que habia algo abajo.
   Equipo mas chico, menos relleno y titular mas corto de alto. */
@media (max-width:640px){
  .ig-hero__cuerpo{ padding:30px 20px 34px; gap:20px; }
  .ig-hero__titulo{ font-size:27px; }
  .ig-hero__bajada{ font-size:15px; }
  .ig-hero__escena{ padding:0 0 14px; }
  .ig-fono{ width:146px; height:298px; }
  .ig-fono__cara{ width:146px; height:298px; margin:-149px 0 0 -73px; border-radius:24px; }
  .ig-fono__pantalla{ border-radius:20px; }
  .ig-fono__camaras{ width:61px; height:61px; border-radius:17px; padding:7px; }
  .ig-fono__lente{ width:20px; height:20px; }
  .ig-fono__canto--izq,.ig-fono__canto--der{ height:260px; margin:-130px 0 0 -5px; }
  .ig-fono__canto--izq{ transform:rotateY(-90deg) translateZ(73px); }
  .ig-fono__canto--der{ transform:rotateY(90deg)  translateZ(73px); }
  .ig-fono__canto--arriba,.ig-fono__canto--abajo{ width:108px; margin:-5px 0 0 -54px; }
  .ig-fono__canto--arriba{ transform:rotateX(90deg)  translateZ(149px); }
  .ig-fono__canto--abajo{ transform:rotateX(-90deg) translateZ(149px); }
}

/* ---------- Accesibilidad ---------- */
@media (prefers-reduced-motion:reduce){
  .ig-hero__filete,.ig-hero__titulo,.ig-hero__bajada,.ig-hero__cta,
  .ig-hero__pista,.ig-hero__escena,.ig-fono,.ig-hero__pistaIcono{ animation:none !important; }
  .ig-hero__cta{ transition:none; }
}
.ig-hero__puntos{position:absolute;bottom:20px;left:50%;margin-left:-34px;z-index:2;display:flex;gap:8px}
.ig-hero__punto{width:10px;height:6px;border-radius:3px;background:#303744}
.ig-hero__punto--on{width:28px;background:#00C8FF}
@keyframes parpadeoIG{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
.ojoIG{transform-box:fill-box;transform-origin:center;animation:parpadeoIG 3.2s ease-in-out infinite}
.miraIG{transform-box:fill-box;transform-origin:center;transition:transform .16s ease-out}
@media (prefers-reduced-motion:reduce){.ojoIG{animation:none}.miraIG{transition:none;transform:none!important}}
.tile{background:#F1F5F9;transition:background .25s ease,transform .25s ease,box-shadow .25s ease}
.tile:hover,.tile:focus-visible{background:#E9EFF7;transform:translateY(-5px);box-shadow:0 14px 30px rgba(16,19,24,.10)}
.tile .flecha{background:#080B10;transition:background .25s ease,transform .25s ease}
.tile:hover .flecha,.tile:focus-visible .flecha{background:#0848FF;transform:translate(2px,-2px)}
@media (hover:hover){
.tile .desc{max-height:0;opacity:0;overflow:hidden;padding-top:0;transition:max-height .28s ease,opacity .22s ease,padding-top .28s ease}
.tile:hover .desc,.tile:focus-visible .desc{max-height:44px;opacity:1;padding-top:6px}
}
@media (prefers-reduced-motion:reduce){
.tile,.tile .flecha,.tile .desc{transition:none}
.tile:hover,.tile:focus-visible,.tile:hover .flecha,.tile:focus-visible .flecha{transform:none}
}
@media (prefers-reduced-motion: reduce){.social{transition:none}}
.cta:hover{filter:brightness(0.88)}
.cta:focus-visible{outline:3px solid #00C8FF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.cta{transition:none}}

/* ---------- Carrito previo (entra por la derecha) ---------- */

/* ---------- Carruseles con el dedo ----------
   En movil el carril deja de moverse por transform y pasa a scroll nativo con
   enganche: asi hay inercia de verdad y el dedo manda. Las flechas se esconden
   porque su posicion no sabria nada de ese scroll. */
@media (max-width:900px){
  .ig-carril{
    overflow-x:auto !important; overscroll-behavior-x:contain;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; scroll-padding-left:6px;
  }
  .ig-carril::-webkit-scrollbar{ display:none; }
  .ig-carril .pista{ transform:none !important; transition:none !important; }
  .ig-carril .pista > *{ scroll-snap-align:start; }
  .ig-flechas{ display:none !important; }
}
.ig-corto{ display:none; }
.ig-mapa{transition:border-color .2s ease}
.ig-mapa:hover{border-color:#0848FF}

/* 'Como comprar sin riesgo' en movil: fuera el globo, mascota chica y pasos de dos
   lineas. En una pantalla de 390 px los cuatro pasos pesan mas que el adorno. */

  .ig-comprar .ig-globo{ display:none !important; }

  .ig-comprar h2{ font-size:24px !important; }
  .ig-comprar .paso{ padding:14px 0 !important; gap:14px !important; }
  .ig-comprar .paso > div:first-child{ width:30px !important; height:30px !important; font-size:14px !important; }
  .ig-comprar .paso .ig-extra{ display:none !important; }
  .ig-comprar .paso .ig-desc{ font-size:14px !important; padding-top:3px !important; }
  .ig-comprar .paso div[style*="font-size: 19px"]{ font-size:17px !important; }
}

.ign__paso{ display:inline-flex; align-items:center; border:1px solid var(--ign-borde); border-radius:9px; overflow:hidden; }
.ign__pasoBtn{
  width:32px; height:32px; padding:0; border:0; background:#FFFFFF; color:var(--ign-texto);
  font-family:inherit; font-size:17px; line-height:1; cursor:pointer;
}
.ign__pasoBtn:hover{ background:var(--ign-gris); }

.ign__pasoNum{ min-width:30px; text-align:center; font-size:14px; font-weight:700; color:var(--ign-texto); }

/* 'Compra por estado' en telefono: las tres tarjetas apiladas median unos 870 px.
   Pasan a una tira que se desliza, sangrada hasta los bordes de la pantalla. */
@media (max-width:640px){
  .ig-estados{
    flex-wrap:nowrap !important; gap:12px !important;
    overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;

    margin:0 -20px !important; padding:0 20px 4px !important;

  .ig-estados > a div[style*="bottom: 22px"]{ left:16px !important; right:16px !important; bottom:14px !important; }
  .ig-estados > a div[style*="font-size: 22px"]{ font-size:18px !important; }

   de 1200. Aqui se reducen, el boton pasa a ancho completo y se van los dos

@media (max-width:640px){

  .ig-local > div > p{ display:none !important; }
  .ig-largo{ display:none !important; }
  .ig-corto{ display:inline !important; }
  .ig-local h2{ font-size:22px !important; }
  .ig-local p{ font-size:14.5px !important; }
  .ig-localTxt{ gap:13px !important; }
  .ig-localTxt div[style*="font-size: 15px"]{ font-size:14px !important; }
  .ig-localCtas{ gap:10px !important; padding-top:2px !important; }
  .ig-localCtas > a{ flex:1 1 0; min-width:0; min-height:48px !important; padding:0 12px !important; font-size:14.5px !important; }

   a su propia fila, a lo ancho y con el boton Buscar al lado. Sin capas ni
   clics previos: se ve y se escribe. */
@media (max-width:760px){

    flex-wrap:wrap; height:auto;
    padding-top:9px; padding-bottom:10px; row-gap:9px;
  }
  .ign__buscador{ order:5; flex:1 0 100%; height:46px; padding:0 14px; }

}

   lados pesan distinto) y los iconos a la derecha. */
@media (max-width:760px){
  .ign__principal .ign__int{ position:relative; }

}

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { oscuro: false, favs: {}, slide: 0, dest: 0 };
    this.seguirConLaMirada();
    this.pausarPulso();
    this.heroInteractivo();
    this.animacionesScroll();
    this.navbar();
    this.modelo3D();
  }

  // El pulso se congela mientras se hace scroll.
  pausarPulso() {
    if (typeof window === 'undefined' || window.__igPausaPulso) return;
    window.__igPausaPulso = true;
    function listo() {
      var caja = document.querySelector('.ig-pulso');
      if (!caja) return setTimeout(listo, 120);
      var t = null;
      window.addEventListener('scroll', function () {
        if (t === null) caja.classList.add('quieto');
        else clearTimeout(t);
        t = setTimeout(function () { caja.classList.remove('quieto'); t = null; }, 180);
      }, { passive: true });
    }
    listo();
  }

  // Navbar: sticky, desplegables y panel movil.
  navbar() {
    if (typeof window === 'undefined' || window.igNav) return;
    var listo = function () {
      if (!document.getElementById('ignHeader')) return setTimeout(listo, 120);
      var header = document.getElementById('ignHeader');
        if (!header || header.dataset.ignListo) return;
        header.dataset.ignListo = '1';

        var ham    = document.getElementById('ignHam');
        var panel  = document.getElementById('ignPanel');
        var items  = Array.prototype.slice.call(header.querySelectorAll('.ign__item'));
        var finoPuntero = window.matchMedia && window.matchMedia('(hover: hover)').matches;
        var limpieza = [];                        // para poder soltar todo despues

        function escuchar(obj, evt, fn, op) {
          obj.addEventListener(evt, fn, op);
          limpieza.push(function () { obj.removeEventListener(evt, fn, op); });
        }

        /* ---------- Sticky: clase 'scrolled' pasados los 50 px ---------- */
        var pendiente = false, puesta = false;
        function revisar() {
          pendiente = false;
          /* Banda muerta de 24 a 64 px. Tiene que ser mas ancha que la barra de
             avisos (30 px): al replegarse mueve el contenido y el navegador
             corrige el scroll, y con un umbral unico eso reabria la barra. */
          var y = window.scrollY;
          var debe = puesta ? (y > 24) : (y > 64);
          if (debe !== puesta) { puesta = debe; header.classList.toggle('scrolled', debe); }
        }
        function alScroll() { if (!pendiente) { pendiente = true; requestAnimationFrame(revisar); } }
        escuchar(window, 'scroll', alScroll, { passive: true });
        revisar();

        /* ---------- Desplegables de escritorio ---------- */
        function abrir(li, si) {
          li.classList.toggle('abierto', si);
          var b = li.querySelector('.ign__disp');
          if (b) b.setAttribute('aria-expanded', si ? 'true' : 'false');
        }
        function cerrarTodos(menos) {
          items.forEach(function (li) { if (li !== menos) abrir(li, false); });
        }

        items.forEach(function (li) {
          var btn = li.querySelector('.ign__disp');
          if (!btn) return;

          escuchar(btn, 'click', function (e) {
            e.preventDefault();
            /* Con mouse el menu ya lo abrio el hover: si el clic tambien alternara,
               lo cerraria de inmediato. e.detail === 0 distingue Enter/Espacio. */
            var teclado = e.detail === 0;
            if (finoPuntero && !teclado) return;
            var ya = li.classList.contains('abierto');
            cerrarTodos(li);
            abrir(li, !ya);
          });

          if (finoPuntero) {
            var cerrar;
            escuchar(li, 'mouseenter', function () { clearTimeout(cerrar); cerrarTodos(li); abrir(li, true); });
            escuchar(li, 'mouseleave', function () { cerrar = setTimeout(function () { abrir(li, false); }, 140); });
            limpieza.push(function () { clearTimeout(cerrar); });
          }

          /* Al salir del ultimo enlace con Tab, se cierra. */
          escuchar(li, 'focusout', function (e) {
            if (!li.contains(e.relatedTarget)) abrir(li, false);
          });
        });

        escuchar(document, 'keydown', function (e) {
          if (e.key !== 'Escape') return;
          var abierto = header.querySelector('.ign__item.abierto');
          if (abierto) { abrir(abierto, false); var b = abierto.querySelector('.ign__disp'); if (b) b.focus(); }
          if (panelAbierto()) cerrarPanel();
          if (miniAbierto()) cerrarMini();
        });

        escuchar(document, 'click', function (e) {
          if (!header.contains(e.target)) { cerrarTodos(null); cerrarPanel(); }
        });

        /* ---------- Cajon movil ---------- */
        var velo = document.getElementById('ignVelo');
        var cerrarBtn = document.getElementById('ignCerrar');
        function panelAbierto() { return !!panel && panel.classList.contains('abierto'); }
        function moverPanel(si) {
          if (!panel) return;
          panel.classList.toggle('abierto', si);
          if (velo) velo.classList.toggle('abierto', si);
          if (ham) {
            ham.setAttribute('aria-expanded', si ? 'true' : 'false');
            ham.setAttribute('aria-label', si ? 'Cerrar menú' : 'Abrir menú');
          }
          /* el fondo no se mueve mientras el cajon esta abierto */
          document.body.style.overflow = si ? 'hidden' : '';
          if (si && cerrarBtn) cerrarBtn.focus();
          else if (!si && ham) ham.focus();
        }
        function cerrarPanel() { if (panelAbierto()) moverPanel(false); }
        if (ham && panel) {
          escuchar(ham, 'click', function () { moverPanel(!panelAbierto()); });
          if (velo) escuchar(velo, 'click', cerrarPanel);
          if (cerrarBtn) escuchar(cerrarBtn, 'click', cerrarPanel);
          /* al elegir una categoria el cajon se cierra solo */
          Array.prototype.forEach.call(panel.querySelectorAll('a'), function (a) {
            escuchar(a, 'click', cerrarPanel);
          });
          Array.prototype.forEach.call(panel.querySelectorAll('.ign__acc'), function (b) {
            escuchar(b, 'click', function () {
              var cuerpo = b.nextElementSibling;
              var abre = !cuerpo.classList.contains('abierto');
              cuerpo.classList.toggle('abierto', abre);
              b.setAttribute('aria-expanded', abre ? 'true' : 'false');
            });
          });
        }

                /* ---------- Carrito previo ---------- */
        var mini = document.getElementById('ignMini');
        var miniCerrar = document.getElementById('ignMiniCerrar');
        var iconoCarrito = header.querySelector('.ign__carrito');
        function miniAbierto() { return !!mini && mini.classList.contains('abierto'); }
        function verMini(si) {
          if (!mini) return;
          if (si && panelAbierto()) moverPanel(false);   /* uno u otro, nunca los dos */
          mini.classList.toggle('abierto', si);
          if (velo) velo.classList.toggle('abierto', si);
          document.body.style.overflow = si ? 'hidden' : '';
          if (si && miniCerrar) miniCerrar.focus();
          else if (!si && iconoCarrito) iconoCarrito.focus();
        }
        function cerrarMini() { if (miniAbierto()) verMini(false); }
        if (mini && iconoCarrito) {
          escuchar(iconoCarrito, 'click', function (e) {
            e.preventDefault();          /* el href queda como respaldo si no hay JS */
            verMini(!miniAbierto());
          });
          if (miniCerrar) escuchar(miniCerrar, 'click', cerrarMini);
          if (velo) escuchar(velo, 'click', cerrarMini);
        }
        /* cantidades del carrito previo: el equipo es unidad unica, el accesorio no */
        (function () {
          if (!mini) return;
          var EQ = 2899000, EQT = 2799000, CA = 149000, CAT = 144000, n = 1;
          var cop = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
          function money(v) { return cop.format(v).replace(/\u00a0/g, ' '); }
          var cant   = mini.querySelector('[data-mini-cant]');
          var linea  = mini.querySelector('[data-mini-linea]');
          var sub    = mini.querySelector('[data-mini-subtotal]');
          var transf = mini.querySelector('[data-mini-transf]');
          var cuenta = mini.querySelector('[data-mini-conteo]');
          var menos  = mini.querySelector('[data-mini="-"]');
          if (!cant) return;
          function pintar() {
            cant.textContent = n;
            if (linea)  linea.textContent  = money(CA * n);
            if (sub)    sub.textContent    = money(EQ + CA * n);
            if (transf) transf.textContent = money(EQT + CAT * n) + ' pagando con transferencia';
            if (cuenta) cuenta.textContent = 'Tu carrito (' + (1 + n) + ')';
            if (menos)  menos.disabled = n <= 1;
          }
          Array.prototype.forEach.call(mini.querySelectorAll('[data-mini]'), function (b) {
            escuchar(b, 'click', function () {
              n = Math.max(1, Math.min(5, n + (b.getAttribute('data-mini') === '+' ? 1 : -1)));
              pintar();
            });
          });
          pintar();
        })();

        /* El tema puede re-renderizar: asi se sueltan todos los listeners. */
        window.igNav = {
          /* Lo usa la animacion de agregar al carrito: cuando el producto
             aterriza en el icono, el panel se abre con el resumen. */
          verCarrito: function (si) { verMini(si !== false); },
          destruir: function () {
            limpieza.forEach(function (f) { f(); });
            limpieza = [];
            document.body.style.overflow = '';
            delete header.dataset.ignListo;
          }
        };
    };
    listo();
  }

  // Revelado progresivo y giro del equipo ligados al scroll.
  animacionesScroll() {
    if (typeof window === 'undefined' || window.igAnim) return;
    var listo = function () {
      if (!document.getElementById('igHero')) return setTimeout(listo, 120);
      if (window.igAnim) return;                     // no duplicar si el tema reinyecta

        /* ----------------------------------------------------------------
           CONFIGURACION — es lo unico que hay que tocar.
           'sel' acepta cualquier selector CSS del tema.
           'efecto': 'subir' | 'escala' | 'fundido' | 'auto' (lo lee de data-ig-anim)
           'escalon': milisegundos de retardo entre hermanos (0 = todos juntos)
           ---------------------------------------------------------------- */
        var CONFIG = {
          grupos: [
            /* Cualquier elemento marcado a mano en el HTML */
            { sel: '[data-ig-anim]',                       efecto: 'auto',    escalon: 120 },

            /* Titulos de seccion: funciona en cualquier tema, sin configurar */
            { sel: 'h2',                                   efecto: 'subir',   escalon: 0 },

            /* Bloques de este mismo proyecto */
            { sel: '.tile',                                efecto: 'escala',  escalon: 110 },
      { sel: '.destacado',                           efecto: 'escala',  escalon: 110 },
      { sel: '.paso',                                efecto: 'suave',   escalon: 160 },
      { sel: '.ig-item',                             efecto: 'escala',  escalon: 110 },
      { sel: '.ig-bloque',                           efecto: 'suave',   escalon: 0 },
            { sel: '.pista > a',                           efecto: 'escala',  escalon: 100 },

            /* TIENDANUBE: tarjetas de producto. Si tu tema usa otra clase,
               inspecciona una tarjeta en el navegador y agregala aca. */
            { sel: '.js-item-product, .item-product, .js-masonry-item',
                                                           efecto: 'escala',  escalon: 110 }
          ],

          /* true  = cada seccion se vuelve a animar cada vez que entra en pantalla.
                    Comodo para revisar el diseno.
             false = se anima una sola vez por carga. Es lo que va en produccion. */
          repetir: true,

          umbral: 0.14,                 // cuanto del elemento tiene que verse

          /* El -10% de abajo dispara un poco antes de llegar al borde.
             El valor enorme de arriba estira la zona de observacion hacia arriba:
             sin el, un elemento que pasa de "debajo de la pantalla" a "encima de la
             pantalla" de un salto (barra de scroll, ancla, tecla Fin) nunca cambia
             de estado y se quedaria invisible para siempre. */
          margen: '200000px 0px -10% 0px',

          /* Boton flotante de ayuda. Si tu app de WhatsApp usa otra clase, cambiala. */
          flotante: '.wa, .js-whatsapp, .whatsapp-button',

          hero: {
            sel: '#igFono',             // el equipo del banner
            contenedor: '#igHero',
            grados: 320                 // giro total mientras el banner sale de pantalla
          }
        };

        var quieto = window.matchMedia &&
                     window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------------- 1. Revelado progresivo ---------------- */
        var observador = null;

        function preparar(raiz) {
          if (quieto) return 0;
          var marcados = 0;
          CONFIG.grupos.forEach(function (g) {
            var nodos = (raiz || document).querySelectorAll(g.sel);
            var porPadre = new Map();
            Array.prototype.forEach.call(nodos, function (el) {
              if (el.dataset.igRev) return;             // ya estaba preparado
              var efecto = g.efecto;
              if (efecto === 'auto') efecto = el.getAttribute('data-ig-anim') || 'subir';
              if (['subir', 'escala', 'fundido', 'suave'].indexOf(efecto) < 0) efecto = 'subir';

              el.dataset.igRev = '1';
              el.classList.add('ig-rev', 'ig-rev--' + efecto);

              if (g.escalon) {                          // retardo entre hermanos
                var p = el.parentNode;
                var i = porPadre.get(p) || 0;
                porPadre.set(p, i + 1);
                if (i) el.style.setProperty('--ig-d', Math.min(i, 6) * g.escalon + 'ms');
              }
              observador.observe(el);
              marcados++;
            });
          });
          return marcados;
        }

        function arrancarRevelado() {
          if (quieto || !('IntersectionObserver' in window)) return;
          observador = new IntersectionObserver(function (entradas) {
            entradas.forEach(function (e) {
              // Tambien se revela lo que quedo ARRIBA del viewport: si el usuario
              // salta con la barra de scroll o con un ancla, esos elementos nunca
              // llegan a 'intersecting' y se quedarian invisibles para siempre.
              if (e.isIntersecting || e.boundingClientRect.top < 0) {
                e.target.classList.add('ig-visible');
                if (!CONFIG.repetir) observador.unobserve(e.target);
              } else if (CONFIG.repetir) {
                e.target.classList.remove('ig-visible');   // se re-arma al volver a bajar
              }
            });
          }, { threshold: CONFIG.umbral, rootMargin: CONFIG.margen });
          var marcados = preparar(document);

          /* Red de seguridad: si a los 2 segundos no se revelo NADA, es que el
             observador no funciona en este contexto (una vista previa que no
             scrollea, un iframe raro, un lector). Se muestra todo de una vez
             antes que dejar la pagina vacia. */
          if (marcados) setTimeout(function () {
            if (document.querySelector('.ig-rev.ig-visible')) return;
            Array.prototype.forEach.call(document.querySelectorAll('.ig-rev'), function (el) {
              el.classList.add('ig-visible');
              if (observador) observador.unobserve(el);
            });
          }, 2000);
        }

        /* ---------------- 2. Giro del equipo con el scroll ---------------- */
        function arrancarHero() {
          var fono = document.querySelector(CONFIG.hero.sel);
          var caja = document.querySelector(CONFIG.hero.contenedor);
          if (!fono || !caja) return;

          caja.classList.add('ig-hero--scroll');
          window.igHeroScroll = true;
          if (typeof window.igHeroDetener === 'function') window.igHeroDetener();

          var pista = caja.querySelector('.ig-hero__pista');
          if (pista) {
            var txt = pista.lastChild;
            if (txt && txt.nodeType === 3) txt.nodeValue = ' Baja para girar el equipo';
          }

          if (quieto) { fono.style.transform = 'rotateY(-18deg)'; return; }

          /* Un solo listener pasivo, agrupado con requestAnimationFrame: el layout
             se lee dentro del cuadro, nunca dentro del evento de scroll. */
          var pendiente = false, visible = true;

          /* Las medidas del banner se toman una vez, no en cada cuadro: leer
             getBoundingClientRect() despues de haber escrito un estilo obliga al
             navegador a recalcular el layout completo, y ahi se iba el tiron. */
          var topCaja = 0, altoCaja = 1;
          function medirCaja() {
            var c = caja.getBoundingClientRect();
            topCaja = c.top + window.pageYOffset;
            altoCaja = c.height || 1;
          }
          medirCaja();

          function pintar() {
            pendiente = false;
            var avance = (window.pageYOffset - topCaja) / altoCaja;
            avance = avance < 0 ? 0 : avance > 1 ? 1 : avance;
            var angulo = -18 + avance * CONFIG.hero.grados;
            fono.style.transform = 'rotateY(' + angulo.toFixed(2) + 'deg)';
            window.__igAngulo = angulo;     // el modelo 3D gira con el mismo valor
          }
          function alHacerScroll() {
            if (pendiente || !visible) return;
            pendiente = true;
            requestAnimationFrame(pintar);
          }

          window.addEventListener('scroll', alHacerScroll, { passive: true });
          window.addEventListener('resize', function () { medirCaja(); alHacerScroll(); }, { passive: true });
          pintar();

          /* No gastar cuadros mientras el banner no se ve. */
          if ('IntersectionObserver' in window) {
            new IntersectionObserver(function (e) {
              visible = e[0].isIntersecting;
              if (visible) alHacerScroll();
            }, { threshold: 0 }).observe(caja);
          }
        }


        /* ---------------- 3. Boton flotante de ayuda ---------------- */
        function arrancarFlotante() {
          var wa = document.querySelector(CONFIG.flotante);
          if (!wa) return;
          var hero = document.querySelector(CONFIG.hero.contenedor);
          if (!hero || !('IntersectionObserver' in window) || quieto) return;

          /* Entra cuando el banner ya casi no se ve: arriba del todo compite con
             el boton principal, y mas abajo es justo donde aparecen las dudas. */
          wa.classList.add('wa--oculto');
          new IntersectionObserver(function (e) {
            wa.classList.toggle('wa--oculto', e[0].isIntersecting);
          }, { threshold: 0.4 }).observe(hero);
        }

        /* ---------------- Arranque ---------------- */
        function iniciar() { arrancarRevelado(); arrancarHero(); arrancarFlotante(); }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', iniciar);
        } else {
          iniciar();
        }

        /* Para temas que cargan productos despues (scroll infinito, filtros):
           llamar a window.igAnim.refrescar() cuando se agregue contenido. */
        window.igAnim = {
          refrescar: function (raiz) { return observador ? preparar(raiz) : 0; },
          config: CONFIG
        };
    };
    listo();
  }

  // Banner: giro de 360 grados del equipo y resplandor que sigue al cursor.
  heroInteractivo() {
    if (typeof window === 'undefined' || window.__igHero) return;
    window.__igHero = true;
    var intentar = function () {
      if (!document.getElementById('igHero')) return setTimeout(intentar, 120);
      var hero = document.getElementById('igHero');
        if (!hero || hero.dataset.igListo) return;        // no duplicar si el tema reinyecta
        hero.dataset.igListo = '1';
      
        var fono   = document.getElementById('igFono');
        var escena = document.getElementById('igEscena');
        var mm     = window.matchMedia;
        var quieto = mm && mm('(prefers-reduced-motion: reduce)').matches;
        var raton  = mm && mm('(hover: hover)').matches;
      
        var angulo = -18, objetivo = null, activo = false;
      
        function normaliza(a) { while (a > 180) a -= 360; while (a < -180) a += 360; return a; }
      
        function marco() {
          if (!activo) return;
          if (objetivo === null) {
            angulo = normaliza(angulo + 0.22);            // giro lento en reposo
          } else {
            angulo = normaliza(angulo + normaliza(objetivo - angulo) * 0.10);
          }
          fono.style.transform = 'rotateY(' + angulo.toFixed(2) + 'deg)';
          /* Si el modelo 3D esta montado, gira con este mismo angulo: asi
             hereda el seguimiento del cursor y el giro en reposo sin repetir
             la logica en dos sitios. */
          window.__igAngulo = angulo;
          requestAnimationFrame(marco);
        }
        function arranca() {
          if (window.igHeroScroll) return;      // manda el modulo de scroll
          if (!activo) { activo = true; requestAnimationFrame(marco); }
        }
        function detiene() { activo = false; }
        window.igHeroDetener = detiene;   // el modulo de scroll toma el mando
      
        if (quieto || window.igHeroScroll) {
          if (quieto) fono.style.transform = 'rotateY(-18deg)';
        } else {
          arranca();
          // No gastar cuadros mientras el banner no se ve.
          if ('IntersectionObserver' in window) {
            new IntersectionObserver(function (e) {
              e[0].isIntersecting ? arranca() : detiene();
            }, { threshold: 0 }).observe(hero);
          }
          document.addEventListener('visibilitychange', function () {
            document.hidden ? detiene() : arranca();
          });
        }
      
        if (raton && !quieto && !window.igHeroScroll) {
      
          // Giro de 360 grados segun la posicion horizontal sobre el equipo.
          escena.addEventListener('mousemove', function (e) {
            var c = escena.getBoundingClientRect();
            objetivo = ((e.clientX - c.left) / c.width - 0.5) * 360;
          }, { passive: true });
      
          escena.addEventListener('mouseleave', function () { objetivo = null; }, { passive: true });
        }

        /* ---------- El pulso, a la altura del equipo ----------
           El trazo esta dibujado para el banner ancho, donde cruza el iPhone
           por debajo del centro. Cuando el banner se apila (telefono debajo
           del texto) ese mismo trazo queda arriba del todo, lejos del equipo.
           Aca se baja lo justo para que pase por el centro del telefono; se
           mide en vez de usar un numero fijo porque el alto del banner cambia
           con cada ancho de pantalla y cada vez que se edita el titular. */
        var pulso = document.querySelector('.ig-pulso');
        var lienzo = pulso && pulso.querySelector('svg');
        var texto = hero.querySelector('.ig-hero__texto');
        var LINEA = 332 / 600;        // la corriente principal dentro del viewBox

        /* Altura de maquetacion dentro del banner, sumando offsets. Se hace asi
           y no con getBoundingClientRect porque en el banner hay animaciones
           que mueven las cajas: el equipo flota 12 px y la escena entra
           deslizandose 26 px. Midiendo el rectangulo real, el ajuste salia
           distinto segun el instante; los offsets ignoran las transformaciones. */
        function altoEnBanner(el) {
          var y = 0, n = el;
          while (n && n !== hero) { y += n.offsetTop; n = n.offsetParent; }
          return n === hero ? y : null;
        }

        function alinearPulso() {
          if (!lienzo || !texto) return;
          var yEscena = altoEnBanner(escena), yTexto = altoEnBanner(texto);
          if (yEscena === null || yTexto === null) return;
          if (yEscena < yTexto + texto.offsetHeight - 8) {   // banner ancho
            lienzo.style.transform = '';                     // ahi el trazo ya esta bien
            return;
          }
          /* El centro del equipo, no el de su caja: la escena lleva mas relleno
             abajo que arriba (deja sitio al reflejo) y el centro se correria. */
          var css = getComputedStyle(escena);
          var arriba = parseFloat(css.paddingTop) || 0;
          var abajo = parseFloat(css.paddingBottom) || 0;
          var centro = yEscena + arriba + (escena.offsetHeight - arriba - abajo) / 2;
          var salto = Math.round(centro - LINEA * hero.clientHeight);
          lienzo.style.transform = Math.abs(salto) > 4 ? 'translateY(' + salto + 'px)' : '';
        }

        if (lienzo) {
          requestAnimationFrame(alinearPulso);
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(alinearPulso);
          if ('ResizeObserver' in window) {
            new ResizeObserver(function () { requestAnimationFrame(alinearPulso); }).observe(hero);
          } else {
            window.addEventListener('resize', alinearPulso, { passive: true });
          }
        }
    };
    intentar();
  }

  /* El iPhone del banner en 3D de verdad (modelo .glb de 577 KB).
     Lo que se ve de entrada es el telefono dibujado con CSS, que aparece al
     instante; este modulo vive aparte, se descarga solo si el equipo aguanta
     y cuando esta listo cambia uno por otro con un fundido. Si el archivo no
     esta donde se busca —pasa dentro del lienzo de diseno, que sirve los
     artboards desde otra ruta— no ocurre nada y el banner se queda con el
     telefono CSS. Por eso va envuelto en un try. */
  modelo3D() {
    if (typeof window === 'undefined') return;
    var intentar = function () {
      if (!document.getElementById('igEscena')) return setTimeout(intentar, 150);
      if (document.querySelector('#igEscena canvas')) return;      // ya esta puesto
      /* Las tres piezas viven en el almacen del artefacto, igual que las
         fotos: por eso llevan direccion /_blob/. Al exportar el sitio se
         cambian por los archivos de la carpeta 3d/. */
      var MODULO = './3d/fono3d.js';
      var TRES   = './3d/tres.min.js';
      var DATOS  = './3d/iphone-datos.js';
      /* Dentro del modulo, una ruta relativa se resolveria contra el propio
         modulo y no contra la pagina: por eso se mandan ya resueltas. */
      var completa = function (u) {
        try { return new URL(u, document.baseURI).href; } catch (e) { return u; }
      };
      import(MODULO)
        .then(function (m) {
          if (m && m.montar) m.montar({ tres: completa(TRES), datos: completa(DATOS) });
        })
        .catch(function (e) { console.warn('3D del banner: no se pudo cargar', e); });
    };
    intentar();
  }

  // Los ojos siguen el cursor. Se toca el DOM directo y no el estado, para no
  // re-renderizar la pantalla entera en cada movimiento del mouse.
  seguirConLaMirada() {
    if (typeof window === 'undefined' || window.__igMirada) return;
    window.__igMirada = true;
    var QUIETO = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (QUIETO) return;
    var RADIO = 3.2;       // unidades del SVG: suficiente para notarse, no para distraer
    var ALCANCE = 520;     // a mas de esto de distancia, la mirada vuelve al centro
    window.addEventListener('mousemove', function (e) {
      var ojos = document.querySelectorAll('.miraIG');
      if (!ojos.length) return;
      for (var i = 0; i < ojos.length; i++) {
        var c = ojos[i].getBoundingClientRect();
        var dx = e.clientX - (c.left + c.width / 2);
        var dy = e.clientY - (c.top + c.height / 2);
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var fuerza = Math.min(1, ALCANCE / Math.max(d, 1)) * Math.min(1, d / 120);
        ojos[i].style.transform = 'translate(' + (dx / d * RADIO * fuerza).toFixed(2) + 'px,'
          + (dy / d * RADIO * fuerza).toFixed(2) + 'px)';
      }
    }, { passive: true });
  }
  renderVals() {
    // Tema: el atributo viaja en el contenedor raiz y la hoja de estilos hace el resto.
    // claro por defecto; el boton de la cabecera enciende el modo oscuro
    const oscuro = !!this.state.oscuro;
    // PRECIOS DE DEMOSTRACION, tomados del mercado colombiano en octubre de 2026.
    // NO son los precios del cliente: reemplazarlos al conectar el catalogo real.
    // money() los formatea en pesos y el % de descuento se calcula a partir de
    // valor y antes, nunca se escribe a mano.
    const cop = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
    const money = (v, ph) => (typeof v === 'number' ? cop.format(v).replace(/\u00a0/g, ' ') : ph);
    const fuente = [
      { name: 'iPhone 18 Pro 256 GB', cond: 'Nuevo sellado · Garantía oficial',
        estado: 'sellado', etiqueta: 'Nuevo sellado',
        img: 'assets/b69830d08dc0dd73afcc47feb1a1b922.webp',
        enOferta: false, valor: 5449000, antes: null, transferencia: 5249000 },
      { name: 'iPhone 17 Pro 256 GB', cond: 'Open box · Batería 100%',
        estado: 'open', etiqueta: 'Open box',
        img: 'assets/6c5cef522cdd328d96a450bcf4a78780.webp',
        enOferta: true, valor: 4299000, antes: 4799000, transferencia: 4149000 },
      { name: 'iPhone 16 Pro Max 256 GB', cond: 'Nuevo sellado · Garantía oficial',
        estado: 'sellado', etiqueta: 'Nuevo sellado',
        img: 'assets/df229c139deb24612f522d3f80622e30.webp',
        enOferta: false, valor: 5499000, antes: null, transferencia: 5299000 },
      { name: 'iPhone 15 Pro 128 GB', cond: 'Open box · Batería 100%',
        estado: 'open', etiqueta: 'Open box',
        img: 'assets/7a14c29dcda3ac440a4e620002d054a8.webp',
        enOferta: true, valor: 2899000, antes: 3299000, transferencia: 2799000 },
      { name: 'iPhone 14 128 GB', cond: 'Usado grado A · Batería 92%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/0ce668a7bd218dea2e05be77b4dd89d6.webp',
        enOferta: false, valor: 1699000, antes: null, transferencia: 1639000 },
      { name: 'iPhone 13 128 GB', cond: 'Usado grado A · Batería 89%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        enOferta: true, valor: 1349000, antes: 1499000, transferencia: 1299000 },
      { name: 'iPhone 13 256 GB', cond: 'Usado grado A · Batería 94%',
        estado: 'usado', etiqueta: 'Usado grado A',
        img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        enOferta: false, valor: 1749000, antes: null, transferencia: 1689000 }
    ];
    const tonos = {
      sellado: { bg: '#E3F4EC', color: '#0B5C39' },
      open:    { bg: '#E6EDFF', color: '#0848FF' },
      usado:   { bg: '#FDF0DC', color: '#8A4B08' }
    };
    const favs = this.state.favs || {};
    // Carrusel de entregas: cada video enlaza al equipo que se entrego.
    // Solo lleva 'antes' el que tiene descuento real en el catalogo.
    const PASO = 248, VISIBLES = 4;
    const clips = [
      { nombre: 'iPhone 16 Pro Max 256 GB', img: 'assets/df229c139deb24612f522d3f80622e30.webp',
        precio: 5499000, antes: null },
      { nombre: 'iPhone 15 Pro 128 GB', img: 'assets/7a14c29dcda3ac440a4e620002d054a8.webp',
        precio: 2899000, antes: 3299000 },
      { nombre: 'iPhone 14 128 GB', img: 'assets/0ce668a7bd218dea2e05be77b4dd89d6.webp',
        precio: 1699000, antes: null },
      { nombre: 'iPhone 13 128 GB', img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        precio: 1349000, antes: 1499000 },
      { nombre: 'iPhone 13 256 GB', img: 'assets/b37e990368e842a5c6bcb4540f182744.webp',
        precio: 1749000, antes: null }
    ];
    const maxSlide = Math.max(0, clips.length - VISIBLES);
    const slide = Math.min(this.state.slide || 0, maxSlide);
    const videos = clips.map((c) => ({
      nombre: c.nombre, img: c.img, alt: 'Entrega de ' + c.nombre,
      enOferta: typeof c.antes === 'number',
      precio: money(c.precio, ''), antes: c.antes ? money(c.antes, '') : ''
    }));

    // Slider de destacados: 4 tarjetas a la vista, el resto se desliza.
    const PASO_D = 289, VISIBLES_D = 4;
    const maxDest = Math.max(0, fuente.length - VISIBLES_D);
    const dest = Math.min(this.state.dest || 0, maxDest);

    const products = fuente.map((p, i) => {
      const hayPrecios = (typeof p.valor === 'number' && typeof p.antes === 'number' && p.antes > p.valor);
      const off = hayPrecios || p.enOferta;
      // con descuento la etiqueta pasa a ser el %, y desplaza a la del estado
      const etiquetaOff = hayPrecios ? Math.round((1 - p.valor / p.antes) * 100) + '% OFF' : '[X]% OFF';
      const tono = tonos[p.estado];
      const fav = !!favs[i];
      return {
        name: p.name, cond: p.cond,
        // los sellados abren la ficha de equipo nuevo (color y capacidad); los demas, la de unidad unica
        enlace: p.estado === 'sellado' ? 'ProductoNuevo.dc.html' : 'Producto.dc.html', off: off,
        tieneFoto: !!p.img, sinFoto: !p.img,
        img: p.img,
        alt: p.name + ', vista trasera y frontal',
        badge: off ? etiquetaOff : p.etiqueta,
        badgeBg: off ? '#0848FF' : tono.bg,
        badgeColor: off ? '#FFFFFF' : tono.color,
        icoSellado: !off && p.estado === 'sellado',
        icoOpen: !off && p.estado === 'open',
        icoUsado: !off && p.estado === 'usado',
        price: money(p.valor, '$ [PRECIO]'),
        was: money(p.antes, '$ [ANTES]'),
        transfer: money(p.transferencia, '$ [CON TRANSFERENCIA]'),
        fav: fav,
        favFill: fav ? '#0848FF' : 'none',
        favColor: fav ? '#0848FF' : '#94A1B3',
        favLabel: (fav ? 'Quitar de favoritos: ' : 'Guardar en favoritos: ') + p.name,
        toggleFav: () => {
          const next = Object.assign({}, this.state.favs);
          next[i] = !next[i];
          this.setState({ favs: next });
        }
      };
    });
    return {
      tema: oscuro ? 'oscuro' : 'claro',
      temaOscuro: oscuro,
      temaClaro: !oscuro,
      temaLabel: oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro',
      cambiarTema: () => this.setState({ oscuro: !oscuro }),
      products: products,
      videos: videos,
      desplazamiento: slide * PASO,
      corrimientoDest: dest * PASO_D,
      destAntes: () => this.setState({ dest: Math.max(0, dest - 1) }),
      destSiguiente: () => this.setState({ dest: Math.min(maxDest, dest + 1) }),
      colDestAntes: dest === 0 ? '#C7CEDA' : '#101318',
      colDestSiguiente: dest >= maxDest ? '#C7CEDA' : '#101318',
      curDestAntes: dest === 0 ? 'not-allowed' : 'pointer',
      curDestSiguiente: dest >= maxDest ? 'not-allowed' : 'pointer',
      verAntes: () => this.setState({ slide: Math.max(0, slide - 1) }),
      verSiguiente: () => this.setState({ slide: Math.min(maxSlide, slide + 1) }),
      colAntes: slide === 0 ? '#C7CEDA' : '#101318',
      colSiguiente: slide >= maxSlide ? '#C7CEDA' : '#101318',
      curAntes: slide === 0 ? 'not-allowed' : 'pointer',
      curSiguiente: slide >= maxSlide ? 'not-allowed' : 'pointer'
    };
  }
}

window.__igArrancar(Component, ["seguirConLaMirada", "pausarPulso", "heroInteractivo", "animacionesScroll", "navbar", "modelo3D"]);
